<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 6 856 82" font-family="'Segoe UI', Tahoma, Verdana, sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#101f2e"/>
    </marker>
  </defs>

  <!-- steps -->
  <g stroke="#101f2e" stroke-width="1.5">
    <rect x="14"  y="20" width="150" height="56" rx="10" fill="#f4f6f8"/>
    <rect x="184" y="20" width="150" height="56" rx="10" fill="#f4f6f8"/>
    <rect x="354" y="20" width="150" height="56" rx="10" fill="#f4f6f8"/>
    <rect x="524" y="20" width="150" height="56" rx="10" fill="#f4f6f8"/>
    <rect x="694" y="20" width="150" height="56" rx="10" fill="#101f2e" stroke="#fcb770" stroke-width="2"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#2c3e50" font-weight="bold">
    <text x="89"  y="53">Generate seed</text>
    <text x="259" y="53">Split (k-of-n)</text>
    <text x="429" y="53">Load shares</text>
    <text x="599" y="53">Backup test</text>
    <text x="769" y="53" fill="#fcb770">Wrap → HSM</text>
  </g>

  <!-- arrows -->
  <g stroke="#101f2e" stroke-width="2" marker-end="url(#ar)">
    <line x1="164" y1="48" x2="182" y2="48"/>
    <line x1="334" y1="48" x2="352" y2="48"/>
    <line x1="504" y1="48" x2="522" y2="48"/>
    <line x1="674" y1="48" x2="692" y2="48"/>
  </g>
</svg>
