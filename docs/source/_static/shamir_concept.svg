<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 28 596 88" font-family="'Segoe UI', Tahoma, Verdana, sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#101f2e"/>
    </marker>
  </defs>

  <!-- Secret -->
  <rect x="20" y="42" width="112" height="60" rx="12" fill="#101f2e" stroke="#fcb770" stroke-width="2"/>
  <text x="76" y="78" text-anchor="middle" fill="#fcb770" font-size="16" font-weight="bold">Secret</text>

  <!-- split arrow -->
  <line x1="134" y1="72" x2="202" y2="72" stroke="#101f2e" stroke-width="2" marker-end="url(#ar)"/>
  <text x="168" y="62" text-anchor="middle" fill="#2c3e50" font-size="12">split</text>

  <!-- n shares -->
  <g fill="#f4f6f8" stroke="#101f2e" stroke-width="1.5">
    <rect x="212" y="42" width="64" height="60" rx="8"/>
    <rect x="290" y="42" width="64" height="60" rx="8"/>
    <rect x="368" y="42" width="64" height="60" rx="8"/>
    <rect x="446" y="42" width="64" height="60" rx="8"/>
    <rect x="524" y="42" width="64" height="60" rx="8"/>
  </g>
  <g fill="#7c8896" font-size="10" text-anchor="middle">
    <text x="244" y="62">share</text><text x="322" y="62">share</text><text x="400" y="62">share</text>
    <text x="478" y="62">share</text><text x="556" y="62">share</text>
  </g>
  <g fill="#2c3e50" font-size="18" font-weight="bold" text-anchor="middle">
    <text x="244" y="90">1</text><text x="322" y="90">2</text><text x="400" y="90">3</text>
    <text x="478" y="90">4</text><text x="556" y="90">5</text>
  </g>
</svg>
